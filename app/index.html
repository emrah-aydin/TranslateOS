<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TranslateOS</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; font-family: sans-serif; }
  #hdmi, #hdmi video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  /* Türkçe altyazı: İngilizce altyazının TAM ÜSTÜNE oturur, %90 koyu (servis altındaki İngilizceyi yine okuyabilsin diye). */
  #sub {
    position: absolute; box-sizing: border-box; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 6px 20px; max-width: 1760px;
    background: rgba(0, 0, 0, 0.9); color: #fff; border-radius: 6px;
    font: 600 40px/1.25 sans-serif;
  }

  /* Durum yazısı (sağ üst, kısa süreli) */
  #status {
    position: absolute; right: 28px; top: 24px; padding: 8px 16px; border-radius: 8px;
    background: rgba(0,0,0,.7); color: #bfe9ff; font-size: 24px; display: none;
  }

  /* Açılış rozeti */
  #badge {
    position: absolute; left: 32px; top: 28px; display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-radius: 14px; background: rgba(8,12,20,.78);
    border: 1px solid rgba(120,200,255,.35); color: #fff; transition: opacity .6s;
  }
  #badge .logo { font-weight: 800; font-size: 30px; letter-spacing: .5px; }
  #badge .logo b { color: #5ec8ff; }
  #badge .by { font-size: 20px; color: #9fb3c8; }

  /* Menü (Yeşil tuş): küçük ve sade */
  #menu {
    position: absolute; right: 40px; top: 40px; width: 380px; display: none;
    padding: 22px 26px; border-radius: 16px; color: #e9f2fb;
    background: rgba(10,16,26,.92); border: 1px solid rgba(94,200,255,.25);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #menu h1 { margin: 0 0 14px; font-size: 32px; font-weight: 800; }
  #menu h1 b { color: #5ec8ff; }
  #menu .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 20px; color: #9fb3c8; }
  #menu .row span:last-child { color: #fff; font-weight: 600; }
  #menu .keys { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 17px; color: #9fb3c8; line-height: 1.7; }
  #menu .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
  #menu .credit { margin-top: 14px; font-size: 16px; color: #7f93a8; }
  #menu .credit b { color: #fff; }
</style>
</head>
<body>
<div id="hdmi"></div>
<div id="sub"></div>
<div id="status"></div>

<div id="badge">
  <div class="logo">Translate<b>OS</b></div>
  <div class="by">by Emrah AYDIN</div>
</div>

<div id="menu">
  <h1>Translate<b>OS</b></h1>
  <div class="row"><span>Altyazı</span><span id="m-sub">Açık</span></div>
  <div class="row"><span>Türkçe</span><span id="m-place">İngilizcenin üstünde</span></div>
  <div class="row"><span>Çevrilen cümle</span><span id="m-calls">0</span></div>
  <div class="row"><span>Hafızadaki cümle</span><span id="m-mem">0</span></div>
  <div class="keys">
    <div><span class="dot" style="background:#e5484d"></span>Altyazıyı aç / kapat</div>
    <div><span class="dot" style="background:#f5c542"></span>Türkçe üstte / yerine</div>
    <div><span class="dot" style="background:#46a758"></span>Bu menü</div>
  </div>
  <div class="credit"><b>Emrah AYDIN</b> · @emrahaydin.es</div>
</div>

<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TranslateOS</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #hdmi, #hdmi video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  /* Türkçe altyazı: İngilizce altyazı bölgesinin (alt %13,5) hemen üstünde, alt kenarı sabit. */
  #sub {
    position: absolute; left: 50%; bottom: 152px; transform: translateX(-50%);
    max-width: 1500px; padding: 8px 26px; background: #000; color: #fff;
    font: 600 42px/1.3 sans-serif; text-align: center; border-radius: 6px;
    display: none;
  }
  #status {
    position: absolute; right: 28px; top: 24px; padding: 6px 14px; border-radius: 6px;
    background: rgba(0,0,0,.65); color: #9fe; font: 24px sans-serif; display: none;
  }
</style>
</head>
<body>
<div id="hdmi"></div>
<div id="sub"></div>
<div id="status"></div>
<script src="app.js"></script>
</body>
</html>

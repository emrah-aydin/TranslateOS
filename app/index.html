<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TranslateOS</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; font-family: sans-serif; }
  #hdmi, #hdmi video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  /* Türkçe altyazı: İngilizce altyazının TAM ÜSTÜNE oturur, %90 koyu (servis altındaki İngilizceyi yine okuyabilsin diye). */
  #sub {
    position: absolute; box-sizing: border-box; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 6px 20px; max-width: 1760px;
    background: rgba(0, 0, 0, 0.9); color: #fff; border-radius: 6px;
    font: 600 40px/1.25 sans-serif;
  }

  /* Durum yazısı (sağ üst, kısa süreli) */
  #status {
    position: absolute; right: 28px; top: 24px; padding: 8px 16px; border-radius: 8px;
    background: rgba(0,0,0,.7); color: #bfe9ff; font-size: 24px; display: none;
  }

  /* Açılış rozeti */
  #badge {
    position: absolute; left: 32px; top: 28px; display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-radius: 14px; background: rgba(8,12,20,.78);
    border: 1px solid rgba(120,200,255,.35); color: #fff; transition: opacity .6s;
  }
  #badge .logo { font-weight: 800; font-size: 30px; letter-spacing: .5px; }
  #badge .logo b { color: #5ec8ff; }
  #badge .by { font-size: 20px; color: #9fb3c8; }

  /* Menü (Yeşil tuş) */
  #menu {
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%); width: 560px; display: none;
    padding: 34px 38px; border-radius: 22px; color: #e9f2fb;
    background: linear-gradient(160deg, rgba(14,22,36,.94), rgba(6,10,18,.94));
    border: 1px solid rgba(94,200,255,.35); box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  #menu h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: .5px; }
  #menu h1 b { color: #5ec8ff; }
  #menu .tag { margin: 6px 0 22px; color: #8ea6bd; font-size: 22px; }
  #menu .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 24px; }
  #menu .row span:last-child { color: #fff; font-weight: 600; }
  #menu .on { color: #6ef0a8 !important; } #menu .off { color: #ff8a8a !important; }
  #menu .keys { margin-top: 18px; font-size: 20px; color: #8ea6bd; line-height: 1.6; }
  #menu .credit { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(94,200,255,.25); }
  #menu .credit .name { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
  #menu .credit .ig { font-size: 22px; color: #ff9ad5; margin-top: 4px; }
</style>
</head>
<body>
<div id="hdmi"></div>
<div id="sub"></div>
<div id="status"></div>

<div id="badge">
  <div class="logo">Translate<b>OS</b></div>
  <div class="by">by Emrah AYDIN</div>
</div>

<div id="menu">
  <h1>Translate<b>OS</b></h1>
  <div class="tag">Oyun altyazılarını anlık Türkçeye çevirir</div>
  <div class="row"><span>Altyazı</span><span id="m-sub" class="on">Açık</span></div>
  <div class="row"><span>Durum</span><span id="m-state">—</span></div>
  <div class="row"><span>Çevrilen cümle</span><span id="m-calls">0</span></div>
  <div class="row"><span>Hafızadan gelen</span><span id="m-hits">0</span></div>
  <div class="row"><span>HDMI girişi</span><span id="m-hdmi">1</span></div>
  <div class="keys">Kırmızı: altyazı aç / kapat · Yeşil: menü<br>1–4: HDMI girişi · Geri: çıkış</div>
  <div class="credit">
    <div class="name">Emrah AYDIN</div>
    <div class="ig">Instagram · @emrahaydin.es</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
